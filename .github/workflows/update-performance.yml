name: Update performance dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 1 * *"
  push:
    paths:
      - "relatorio_ativos_negociados_python.csv"
      - "src/data/monthlyData.ts"
      - "scripts/generate_cyberpunk_charts.py"
      - "scripts/generate_readme_charts.py"
      - "scripts/update_performance_readme.py"

permissions:
  contents: write

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install chart dependencies
        run: python -m pip install --upgrade pip pandas matplotlib seaborn

      - name: Regenerate charts and metrics
        run: |
          python scripts/generate_readme_charts.py
          python scripts/generate_cyberpunk_charts.py
          python scripts/update_performance_readme.py

      - name: Commit and push changes
        run: |
          git config user.name "quantledger-bot"
          git config user.email "quantledger-bot@users.noreply.github.com"
          git add README.md docs/*.png
          git diff --cached --quiet || git commit -m "chore: refresh performance charts and metrics"
          git push
